<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
  <h2 class="text-2xl font-semibold text-center mb-6">Create account</h2>

  <input id="email" type="email" placeholder="Email"
    class="w-full p-3 mb-3 border rounded">

  <input id="password" type="password" placeholder="Password"
    class="w-full p-3 mb-4 border rounded">

  <button onclick="register()"
    class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700">
    Register
  </button>

  <p class="text-center text-sm mt-4">
    Already registered?
    <a href="login.html" class="text-blue-600 hover:underline">Login</a>
  </p>
</div>

<script src="js/auth.js"></script>
</body>
</html>
