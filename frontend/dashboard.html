<!DOCTYPE html>
<html>
<head>
  <title>My Files</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Share Modal -->
<div id="shareModal"
  class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">

  <div class="bg-white rounded-lg w-full max-w-md p-5">
    <h3 class="font-semibold text-lg mb-4">Sharing</h3>

    <div id="shareList" class="space-y-3 text-sm"></div>

    <div class="mt-5 text-right">
      <button onclick="closeShareModal()"
        class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
        Close
      </button>
    </div>
  </div>
</div>

<body class="bg-gray-100">
<script>
  if (!localStorage.getItem("token")) {
    window.location.href = "/login.html";
  }
</script>
<!-- Top Bar -->
<div class="bg-blue-600 text-white px-6 py-4 flex justify-between items-center">
  <h1 class="font-semibold text-lg">Cloud Storage</h1>
  <button onclick="logout()" class="bg-blue-500 px-4 py-2 rounded hover:bg-blue-700">
    Logout
  </button>
</div>

<div class="flex h-[calc(100vh-64px)]">

  <!-- Sidebar -->
  <aside class="hidden md:block w-64 bg-white border-r p-4">
    <h2 class="font-semibold mb-4">Folders</h2>
    <ul id="folderList" class="space-y-2 text-sm text-gray-700">
      <li onclick="loadRoot()" class="cursor-pointer hover:text-blue-600">
        📁 Root
      </li>
      <li onclick="loadSharedFiles()" class="cursor-pointer">🔗 Shared Files</li>
      <li onclick="loadSharedFolders()" class="cursor-pointer">🔗 Shared Folders</li>


    </ul>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 overflow-auto">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4 gap-3">
      <h2 id="currentPath" class="font-semibold text-gray-700">/</h2>

      <div class="flex gap-2">
        <input type="file" id="fileInput"
          class="block w-full text-sm text-gray-500">
        <button onclick="uploadFile()"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Upload
        </button>
        <button onclick="createFolderPrompt()"
          class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">
          New Folder
        </button>

      </div>
    </div>
    <!-- Breadcrumbs -->
    <div id="breadcrumbs" class="text-sm text-gray-600 mb-3"></div>

    <!-- Search Input -->
    <input id="searchBox"
      placeholder="Search..."
      class="border p-2 rounded w-full sm:w-64"
      oninput="search()" />

    <!-- File Table -->
    <div class="bg-white rounded shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-100 text-gray-600">
          <tr>
            <th class="text-left p-3">Name</th>
            <th class="text-left p-3 hidden sm:table-cell">Size</th>
            <th class="text-left p-3">Action</th>
          </tr>
        </thead>
        <tbody id="fileList"></tbody>
      </table>
    </div>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/breadcrumbs.js"></script>
<script src="js/files.js"></script>
<script src="js/folders.js"></script>
<script src="js/shared.js"></script>
<script src="js/search.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/share.js"></script>

</body>
</html>
