version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile 
    image: local-warehouse-backend
    container_name: warehouse-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

    volumes:
      - ./storage-data:/data/storage
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - warehouse-net

  postgres:
    image: postgres:16
    container_name: warehouse-postgres
    environment:
      POSTGRES_DB: local_warehouse
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # optional (for local debugging)
    restart: unless-stopped
    networks:
      - warehouse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile 
    image: local-warehouse-frontend
    container_name: warehouse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - warehouse-net


volumes:
  postgres-data:
#   storage-data:
#     driver: local

networks:
  warehouse-net:
    driver: bridge
